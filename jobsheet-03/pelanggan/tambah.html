<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pelanggan</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Sistem Informasi Rental PS</h1>
        <p> Tambah Data Pelanggan Baru : </p>
    </header>
        <nav>
               <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-icon">
        ☰
    </label>
    <div class="menu">
            <a href="../index.html">Beranda</a>
            <a href="../ps/list.html">Data PS</a>
            <a href="list.html">Data Pelanggan</a>
            <a href="tambah.html">Tambah Pelanggan</a>
    </div>
        </nav>
    <main>
        <section>
            <article>
                <h2>Formulir Tambah Pelanggan</h2>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="id_pelanggan">ID Pelanggan:</label>
                        <input type="text" id="id_pelanggan" name="id_pelanggan" class="form-control" placeholder="Contoh: PLG003" required>
                    </div>

                    <div class="form-group">
                        <label for="nama_pelanggan">Nama Lengkap:</label>
                        <input type="text" id="nama_pelanggan" name="nama_pelanggan" class="form-control" placeholder="Contoh: Budi Santoso" required>
                    </div>

                    <div class="form-group">
                        <label for="no_hp">No. Telepon / WhatsApp:</label>
                        <input type="tel" id="no_hp" name="no_hp" class="form-control" placeholder="Contoh: 08123456789" required>
                    </div>

                    <div class="form-group">
                        <label for="alamat">Alamat Lengkap:</label>
                        <textarea id="alamat" name="alamat" class="form-control" rows="3" placeholder="Masukkan alamat pelanggan" required></textarea>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Simpan Data</button>
                        <button type="reset" class="btn btn-secondary">Batal</button>
                    </div>
                </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Sistem Informasi Rental PS</p>
    </footer>
</body>
</html>
