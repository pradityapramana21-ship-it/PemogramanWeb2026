<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
     <body class="d-flex flex-column min-vh-100" style="background-color: #f1f5f9;"></body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">
                Sistem Informasi Rental PS
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu" aria-controls="navMenu"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Beranda</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../ps/list.html">Data PS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../ps/tambah.html">Tambah PS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="list.html">Data Pelanggan</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="tambah.html">Tambah Pelanggan</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3" style="color:#1d5b8a;">
                    Daftar Pelanggan Rental PS
                </h2>
                <div class="mb-3">
                    <label for="cariPelanggan" class="form-label fw-semibold">
                        Cari Data Pelanggan
                    </label>

                    <input type="text" class="form-control" id="cariPelanggan"
                        placeholder="Cari kode atau nama pelanggan...">
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="tabelPelanggan">
                        <thead style="background-color:#1d5b8a;">
                            <tr class="text-white">
                                <th>No</th>
                                <th>Kode Pelanggan</th>
                                <th>Nama Pelanggan</th>
                                <th>No Whatsapp</th>
                                <th>Alamat</th>
                                <th>Status Member</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelPelangganBody">
                        </tbody>
                    </table>
                    <div id="loading-indicator" class="text-center py-3">
                        Memuat data pelanggan...
                    </div>
                </div>
            </div>
        </section>
    </main>
<footer class="text-white text-center py-3 small mt-auto" style="background-color: #1d5b8a;">
