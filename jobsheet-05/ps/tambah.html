<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistem Informasi Rental PS | Tambah PS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">Sistem Informasi Rental PS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Data PS</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah PS</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pelanggan/list.html">Data Pelanggan</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pelanggan/tambah.html">Tambah Pelanggan</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3" style="color:#1d5b8a;">Formulir Tambah Unit PS</h2>
                <form action="#" method="POST">
                    <div class="mb-3">
                        <label for="kode_ps" class="form-label fw-semibold">Kode PS</label>
                        <input type="text" class="form-control" id="kode_ps" name="kode_ps" placeholder="Contoh: PS006" required>
                    </div>
                    <div class="mb-3">
                        <label for="nama_unit" class="form-label fw-semibold">Nama Unit</label>
                        <input type="text" class="form-control" id="nama_unit" name="nama_unit" placeholder="Contoh: PlayStation 5 Pro" required>
                    </div>
                    <div class="mb-3">
                        <label for="kategori" class="form-label fw-semibold">Kategori</label>
                        <select class="form-select" id="kategori" name="kategori" required>
                            <option value="">-- Pilih Kategori --</option>
                            <option value="Console Regular">Console Regular</option>
                            <option value="Console Next-Gen">Console Next-Gen</option>
                            <option value="VR Package">VR Package</option>
                            <option value="VIP Room">VIP Room</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="tarif" class="form-label fw-semibold">Tarif / Jam (Rp)</label>
                        <input type="number" class="form-control" id="tarif" name="tarif" placeholder="Contoh: 10000" min="1000" step="500" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Status Unit</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="tersedia" name="status" value="Tersedia" required>
                                <label class="form-check-label" for="tersedia">Tersedia</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="disewa" name="status" value="Disewa">
                                <label class="form-check-label" for="disewa">Disewa</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="maintenance" name="status" value="Maintenance">
                                <label class="form-check-label" for="maintenance">Maintenance</label>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn" style="background-color:#1d5b8a; color:#fff;">Simpan Data</button>
                    <button type="reset" class="btn btn-secondary">Batal</button>
                </form>
            </div>
        </section>
    </main>
    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 Sistem Informasi Rental PS</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
