<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pelanggan</title>
</head>
<body>
    <header>
        <h1>Sistem Informasi Rental PS</h1>
        <p> Tambah Data Pelanggan Baru : </p>
    </header>
        <nav>
            <a href="../index.html">Beranda</a>
            <a href="../ps/list.html">Data PS</a>
            <a href="list.html">Data Pelanggan</a>
            <a href="tambah.html">Tambah Pelanggan</a>
        </nav>
    <main>
        <section>
            <article>
                <h2>Formulir Tambah Pelanggan</h2>
                <form action="#" method="post">
                    <p>
                        <label for="kode_pelanggan">Kode Pelanggan : </label><br>
                        <input type="text" id="kode_pelanggan" name="kode_pelanggan" placeholder="Contoh: PLG003" required>
                    </p>
                    <P>
                        <Label for="nama_pelanggan">Nama Pelanggan</Label><br>
                        <input type="text" id="nama_pelanggan" name="nama_pelanggan" placeholder="Contoh: Budi Setiawan" required>
                    </P>
                    <p>
                        <label for="no_hp">No WhatsApp:</label><br>
                        <input type="tel" id="no_hp" name="no_hp" placeholder="Contoh: 081234567890" required>
                    </p>
                    <p>
                        <label for="kategori_member">Kategori Member: </label>
                        <select id="kategori_member" name="kategori_member" required>
                            <option value=">-- Piih Kategori Member :"></option>
                            <option value="Regular">Regular</option>
                            <option value="Member VIP">Member VIP</option>
                        </select>
                    </p>
                    <p>
                        <label for="alamat">Alamat Lengkap:</label><br>
                        <textarea id="alamat" name="alamat" rows="4" cols="30" placeholder="Masukkan alamat lengkap..." required></textarea>
                    </p>
                    <p>
                        <button type="submit">Simpan Data</button>
                        <button type="reset">Batal</button>
                    </p>
                </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Sistem Informasi Rental PS</p>
    </footer>
</body>
</html>
